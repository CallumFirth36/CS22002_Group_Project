<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quizzler — Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #d9d9d9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chrome {
      width: 980px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 48px rgba(0,0,0,.22);
    }
    .titlebar {
      height: 36px;
      background: #ebebeb;
      border-bottom: 1px solid #d0d0d0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .r{background:#ff5f57;} .y{background:#febc2e;} .g{background:#28c840;}

    /* white page */
    .page { background: #fff; min-height: 560px; }

    /* header: grey box + Quizzler script */
    .header {
      display: flex;
      align-items: center;
      padding: 18px 28px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .logo-sq {
      width: 72px;
      height: 72px;
      background: #d4d4d4;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-sq svg { width: 34px; height: 34px; }
    .brand-script {
      font-family: 'Caveat', cursive;
      font-size: 46px;
      font-weight: 700;
      color: #1a9d9d;
      margin-left: 16px;
      line-height: 1;
    }

    /* centred form area */
    .form-wrap {
      display: flex;
      justify-content: center;
      padding: 48px 0 72px;
    }
    .form-inner { width: 400px; }

    h1 { font-size: 30px; font-weight: 700; color: #111; margin-bottom: 32px; }

    .grp { margin-bottom: 22px; }

    .lbl { display: block; font-size: 14px; font-weight: 700; color: #111; margin-bottom: 8px; }

    /* teal-bordered inputs as shown in wireframe */
    input[type=text], input[type=password] {
      width: 100%;
      border: 2px solid #1a9d9d;
      border-radius: 6px;
      padding: 12px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #222;
      outline: none;
      background: #fff;
      transition: box-shadow .18s;
    }
    input::placeholder { color: #b8b8b8; }
    input:focus { box-shadow: 0 0 0 3px rgba(26,157,157,.15); }

    .btn-create {
      width: 100%;
      padding: 14px 0;
      background: #1a9d9d;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: filter .15s;
    }
    .btn-create:hover { filter: brightness(.88); }

    .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #666; }
    .back a { color: #1a9d9d; text-decoration: none; font-weight: 600; }
    .back a:hover { text-decoration: underline; }

    .err-box {
      display: none;
      margin-bottom: 14px;
      padding: 10px 13px;
      background: #fff1f1;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      font-size: 13px;
      border-radius: 5px;
    }
    .err-box.show { display: block; }
    .ok-box {
      display: none;
      margin-bottom: 14px;
      padding: 10px 13px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #15803d;
      font-size: 13px;
      border-radius: 5px;
      text-align: center;
    }
    .ok-box.show { display: block; }
  </style>
</head>
<body>
<div class="chrome">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
  </div>
  <div class="page">
    <!-- header -->
    <div class="header">
      <div class="logo-sq">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="34" height="34" rx="4" stroke="#555" stroke-width="2.8"/>
          <circle cx="13" cy="14" r="3.5" stroke="#555" stroke-width="2.8"/>
          <polyline points="3,30 14,19 23,26 29,20 37,30" stroke="#555" stroke-width="2.8" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-script">Quizzler</span>
    </div>

    <!-- form -->
    <div class="form-wrap">
      <div class="form-inner">
        <h1>Log in</h1>
        <div class="err-box" id="err"></div>
        <div class="ok-box" id="ok">Account created! Redirecting to login…</div>
        <form id="regForm" novalidate>
          <div class="grp">
            <label class="lbl" for="username">Account number</label>
            <input type="text" id="username" placeholder="Username" autocomplete="username"/>
          </div>
          <div class="grp">
            <label class="lbl" for="password">Password</label>
            <input type="password" id="password" placeholder="Password" autocomplete="new-password"/>
          </div>
          <button type="submit" class="btn-create">Create Account</button>
        </form>
        <div class="back">Already have an account? <a href="login.html">Log in</a></div>
      </div>
    </div>
  </div>
</div>
<script>
  document.getElementById('regForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    var err = document.getElementById('err');
    var ok  = document.getElementById('ok');
    err.classList.remove('show');
    if (!u) { err.textContent = 'Please enter a username.'; err.classList.add('show'); return; }
    if (p.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.classList.add('show'); return; }
    ok.classList.add('show');
    setTimeout(function(){ location.href = 'login.html'; }, 1800);
  });
</script>
</body>
</html>
